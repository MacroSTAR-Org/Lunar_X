name: "Bug 反馈"
description: "在使用 Lunar X 的过程中遇到了 Bug。"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您进行 Bug 反馈。请在上面的标题文本框⬆️起一个能够清晰描述您的问题的标题，便于开发者解决您的问题。
        
        > [!important]
        > 重要：如果要提出**多个 Bug**，请为每一个 Bug 开一个单独的 issue。
        >
        > 如果您不知道如何有效、精准地表述，我们建议您先阅读[《提问的智慧》](https://github.com/ryanhanwu/How-To-Ask-Questions-The-Smart-Way/blob/main/README-zh_CN.md)。
        
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 在开始反馈这个问题之前，请先检查：
      options:
        - label: 我已更新到 [最新提交](https://github.com/MacroSTAR-Org/Lunar_X/commits/master/) 或 已在 [最新提交](https://github.com/MacroSTAR-Org/Lunar_X/commits/master/) 测试，并看过 [最新提交](https://github.com/MacroSTAR-Org/Lunar_X/commits/master/)，确认这一 Bug 还没有修复。我也已在 [Issues](https://github.com/MacroSTAR-Org/Lunar_X/issues?q=label%3Abug) 中检索，确认这一 Bug 未被提交过。
          required: true
        - label: 我已经仔细阅读过选项里的内容，并且知道这个选项不用勾选。
        - label: 我已知晓并同意，此处仅用于汇报程序中存在的问题（关于其他非程序本身的问题应当在 Discussion 板块提出）。
          required: true
  - type: dropdown
    id: bug-category
    attributes:
      label: 问题分类
      description: 这个 Bug 属于哪一部分？便于开发者快速分派。
      options:
        - 核心框架（事件分发 / 消息处理 / 权限体系 / 插件加载）
        - 协议适配（Milky / OneBot v11 连接、消息段、API 调用）
        - 插件相关（内置插件 / 自研插件）
        - WebUI 管理面板
        - 配置 / 启动 / 热重载
        - 其他
      default: 0
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: 使用的协议
      description: 您在 config.json 中配置的 protocol 字段值。
      options:
        - Milky
        - OneBot v11
        - 不确定
    validations:
      required: true
  - type: markdown
    attributes: 
      value: |
        ### Bug 信息

        描述您遇到的 Bug。您可以附上截图、录屏等材料，便于开发者追踪问题。

        > [!note]
        > 上传附件时**请优先使用 GitHub 的附件系统上传附件**，将需要上传的附件粘贴或拖动到撰写区域即可上传。多个文件可打包为 zip 格式后上传。**尽量避免使用需要登陆或安装客户端才能接收附件的网盘（如\*度网盘、\*克网盘、1\*3网盘等）上传附件**，以避免开发者因不具有对应网盘客户端或账户而延误问题诊断。
  - type: textarea
    id: excepted
    attributes:
      label: 期望的行为
      description: 详细的描述你期望发生的行为，突出与目前（可能不正确的）行为的不同。
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 实际结果
      description: 实际发生的行为。
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 重现步骤
      description: |
        详细描述要怎么操作才能再次触发这个 Bug。请注明是在私聊还是群聊中触发、使用的命令或触发词。
      placeholder: |
        1. 首先……
        2. 然后……
        3. ……
    validations:
      required: true
  - type: textarea
    id: plugin-info
    attributes:
      label: 涉及插件（可选）
      description: |
        如果 Bug 与某个插件有关，请填写插件名称或 plugins/ 目录下的文件名。
        可在 WebUI 插件管理页查看已加载的插件列表。
      placeholder: |
        例如：plugins/ai_chat.py（AI 对话插件）或「语录」插件
  - type: textarea
    id: system-environment
    attributes:
      label: 操作环境信息
      description: |
        在您发现这个 Bug 的运行环境。
      placeholder: |
        系统：Windows 11 / Ubuntu 22.04 / ...
        Python 版本：3.10 / 3.11 / 3.12 ...
        运行方式：本机直接运行 / Docker / ...
        协议端及版本：LLBot / LLOneBot / NapCat /  ...
        Lunar X 版本：Git 提交号（如 d945095）或 Release 版本
        日志级别（config.json 中 log_level）：INFO / DEBUG / ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（建议）
      description: |
        请粘贴 **logs/lunarx.log** 中与 Bug 相关的日志片段（建议包含时间戳与堆栈信息）。
        若日志较长，可只截取 Bug 发生时附近的关键片段，或将整个日志文件打包上传。
        如有条件，可临时将 config.json 中的 log_level 改为 DEBUG 复现一次，以获得更详细的日志。
      placeholder: |
        [2026-08-09 12:00:00.000] ... ERROR ... Traceback ...
        ...
  - type: textarea
    id: user-info
    attributes:
      label: 用户信息（可选）
      description: |
        如果是在登录状态下出现的问题，请提供用户ID（在用户信息页面可以看到）。
  - type: textarea
    id: screenshots
    attributes:
      label: 截图/录屏（可选，建议）
      description: |
        如果可能，请提供可以用来进一步描述您的问题的截图或录屏。
  - type: checkboxes
    id: revision
    attributes:
      label: 最后一步
      description: 回顾您的回答
      options:
        - label: 我认为上述的描述已经足以详细，以允许开发人员能复现该问题。如果我的 issue 没有按照上述的要求填写，可能会被无条件关闭。
          required: true
