[project]
name = "lunar-x"
version = "0.1.0"
description = "MacroSTAR Lunar_X — 多平台聊天机器人框架"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.13"

dependencies = [
    # 核心框架与 WebUI
    "aiohttp>=3.9",
    "flask>=3.0",
    "requests>=2.31",
    "psutil>=5.9",
    "websockets>=12.0",
    # 配置、认证与 API
    "cryptography>=42.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
full = [
    # 第三方 API 与网络工具
    "google-generativeai>=0.5",
    "google-api-python-client>=2.0",
    "pygithub>=2.0",
    "httpx>=0.27",
    # 机器人功能与终端输出
    "edge-tts>=6.1",
    "emoji>=2.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
    # 图像与数值处理
    "numpy>=1.26",
    "pillow>=10.0",
]
windows = [
    # Windows 桌面 WebUI 与系统集成
    "PySide6>=6.6",
    "PySide6-Fluent-Widgets>=1.5",
    "pywin32>=306",
    "colorama>=0.4",
    "darkdetect>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "ty>=0.0.1a0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (插件架构允许后置导入)
    "B008",   # function call in default argument (Flask route decorators)
    "SIM108", # ternary operator (readability preference)
    "RUF001", # ambiguous unicode char in string (中文项目允许全角标点)
    "RUF002", # ambiguous unicode char in docstring
    "RUF003", # ambiguous unicode char in comment (中文项目允许全角标点)
    "N816",   # mixedCase variable in global scope (现有命名约定)
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unresolved-import = "error"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "core.*",
    "plugins.*",
]
