<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar X 控制面板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/element-plus.css">
  <link rel="stylesheet" href="/static/vendor/element-plus-dark.css">
  <link rel="stylesheet" href="/static/js/md3-expressive.css">
  <script>
    // 在 Vue 挂载前先定好主题，避免首屏闪白。
    // 旧版三主题的取值（pink/blue/white）在这里一并归一化。
    (function () {
      var t = localStorage.getItem('lunarx_theme');
      if (t !== 'dark' && t !== 'light') t = (t === 'white') ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.addEventListener('DOMContentLoaded', function () {
        document.body.dataset.theme = t;
      });
    })();
  </script>
</head>
<body data-theme="dark">
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:var(--md3e-sans);color:#78838f;">
      加载中…（若长时间无响应，请检查网络或更换现代浏览器访问）
    </div>
  </div>

  <!-- 依赖库（顺序不能改：Vue → Element Plus → 图标 → ECharts） -->
  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus.full.min.js"></script>
  <script src="/static/vendor/element-plus-icons.iife.min.js"></script>
  <script src="/static/vendor/echarts.min.js"></script>

  <!-- 工具层 -->
  <script src="/static/js/bg.js"></script>
  <script src="/static/js/ansi.js"></script>
  <script src="/static/js/api.js"></script>

  <!-- 页面组件（新增页面时需要在这里补一行） -->
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/config.js"></script>
  <script src="/static/js/pages/settings.js"></script>
  <script src="/static/js/pages/plugins.js"></script>
  <script src="/static/js/pages/market.js"></script>
  <script src="/static/js/pages/console.js"></script>

  <!-- 入口，必须最后加载 -->
  <script src="/static/js/app.js"></script>
</body>
</html>
