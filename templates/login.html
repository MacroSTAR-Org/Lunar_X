<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Lunar X 控制面板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/element-plus.css">
  <link rel="stylesheet" href="/static/vendor/element-plus-dark.css">
  <link rel="stylesheet" href="/static/js/md3-expressive.css">
  <script>
    // 主题跟随主界面（localStorage 记忆）。旧版三主题取值在这里归一化：
    // white → light，pink/blue/空 → dark
    (function () {
      var t = localStorage.getItem('lunarx_theme');
      if (t !== 'dark' && t !== 'light') t = (t === 'white') ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.addEventListener('DOMContentLoaded', function () {
        document.body.dataset.theme = t;
      });
    })();
  </script>
</head>
<body data-theme="dark">
  <div id="login-app" class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <h1>Lunar X</h1>
        <p>控制面板</p>
      </div>
      <div style="text-align:center;color:#888;padding:24px 0;font-family:var(--md3e-sans);">
        正在加载登录组件…<br><small>若页面长时间无样式/无输入框，请检查网络连接，或使用新版 Chrome / Edge / Firefox / Safari 访问</small>
      </div>
    </div>
  </div>
  <script src="/static/js/bg.js"></script>
  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus.full.min.js"></script>
  <script src="/static/vendor/element-plus-icons.iife.min.js"></script>
  <script>
    const app = Vue.createApp({
      template: `
      <div class="login-card">
        <div class="login-brand">
          <h1>Lunar X</h1>
          <p>控制面板</p>
        </div>
        <el-form label-position="top" @submit.prevent>
          <el-form-item label="用户名">
            <el-input v-model="username" placeholder="用户名" autocomplete="username" autofocus>
              <template #prefix><el-icon><User /></el-icon></template>
            </el-input>
          </el-form-item>
          <el-form-item label="密码">
            <el-input v-model="password" type="password" show-password placeholder="密码"
                      autocomplete="current-password" @keyup.enter="doLogin">
              <template #prefix><el-icon><Lock /></el-icon></template>
            </el-input>
          </el-form-item>
          <el-button type="primary" style="width: 100%; height: 46px; font-size: 15px; margin-top: 4px;"
                     :loading="loading" @click="doLogin">登 录</el-button>
        </el-form>
        <div class="login-tip">默认账号 lunarx · 默认密码 lunarx</div>
      </div>
      `,
      data() {
        return { username: '', password: '', loading: false };
      },
      methods: {
        async doLogin() {
          if (!this.username.trim() || !this.password) {
            ElementPlus.ElMessage.warning('请输入用户名和密码');
            return;
          }
          this.loading = true;
          try {
            const resp = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: this.username.trim(), password: this.password }),
            });
            const data = await resp.json();
            if (resp.ok) {
              location.href = '/';
            } else {
              ElementPlus.ElMessage.error(data.error || '登录失败');
            }
          } catch (e) {
            ElementPlus.ElMessage.error('网络错误: ' + e.message);
          } finally {
            this.loading = false;
          }
        },
      },
    });
    app.use(ElementPlus);
    for (const [name, comp] of Object.entries(ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.mount('#login-app');
  </script>
</body>
</html>
